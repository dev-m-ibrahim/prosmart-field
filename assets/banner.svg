      <stop offset="0" stop-color="#004a78"/><stop offset="0.55" stop-color="#003a5f"/><stop offset="1" stop-color="#00182a"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19c6e6"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
