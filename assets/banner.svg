    <circle cx="900" cy="60" r="5"/><circle cx="640" cy="290" r="5"/><circle cx="820" cy="70" r="5"/>
  </g>
  <!-- house icon -->
  <g transform="translate(120 70)" filter="url(#glow)" fill="none" stroke="url(#ac)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
